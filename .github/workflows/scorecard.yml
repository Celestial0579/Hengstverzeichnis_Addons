# OpenSSF Scorecard
#
# Bewertet die Supply-Chain-/Governance-Posture des Repos laufend (Branch-Schutz,
# gepinnte Abhängigkeiten, Token-Rechte, gefährliche Workflows, …) und lädt das
# Ergebnis als SARIF ins Code-Scanning (Security-Tab). publish_results macht die
# Bewertung öffentlich abrufbar (Grundlage für den Scorecard-Badge).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF ins Code-Scanning hochladen
      id-token: write          # OIDC für publish_results (keyless)
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
