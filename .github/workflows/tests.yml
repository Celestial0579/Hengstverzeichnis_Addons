# PHPUnit-Testsuite für alle Plugins in diesem Repo
#
#   - Manifest:   generische Struktur-/Konventionsprüfung jedes Verzeichnisses
#                 unter plugins/ (Manifest-Pflichtfelder, Slug-Format,
#                 PHP-Syntax, Namenskonvention der Plugin-Klasse). Braucht
#                 keine Datenbank, läuft immer.
#   - Functional: aktiviert jedes Plugin in einer echten, per `php -S`
#                 gestarteten Hengstverzeichnis_Framework-Instanz (als
#                 Composer-Dev-Abhängigkeit eingebunden, siehe composer.json)
#                 und spielt es per HTTP durch (tests/Functional/*Test.php).
#
# Composer lädt hengstverzeichnis/framework über das VCS-Repository in
# composer.json direkt vom GitHub-Repo des Frameworks (dev-main), tests/bootstrap.php
# kopiert anschließend jedes plugins/<slug>/ dorthin, bevor die Functional-Suite
# den PHP-Testserver startet.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  manifest:
    name: Plugin-Manifest-Prüfung
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Manifest tests
        run: composer test:manifest

  functional:
    name: Plugin-Functional-Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test database
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS hengst_addons_functional;
            CREATE USER IF NOT EXISTS 'hengst'@'%' IDENTIFIED BY 'hengst';
            GRANT ALL PRIVILEGES ON *.* TO 'hengst'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Run Functional tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: hengst_addons_functional
          DB_USER: hengst
          DB_PASS: hengst
          APP_ENV: development
          APP_KEY: ci-addons-functional-test-key-not-for-production-use
          SITE_NAME: CI Addon-Testverband
          ADMIN_USERNAME: e2eaddonadmin
          ADMIN_EMAIL: e2e-addon-admin@example.com
          ADMIN_PASSWORD: FunctionalTest123!
        run: composer test:functional
