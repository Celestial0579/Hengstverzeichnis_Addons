# pre-commit in CI
#
# WARUM: .pre-commit-config.yaml war bisher rein lokal. Wer die Hooks nicht
# installiert hat - jeder frische Klon, jeder Beitrag von aussen, jede
# Automatik - umging gitleaks, shellcheck und die
# Whitespace-Prueflinge vollstaendig. Ein Geheimnis-Scanner, der nur auf den
# Rechnern laeuft, auf denen ihn jemand eingerichtet hat, ist kein Gate,
# sondern eine Bitte.
#
# Der Lauf hier ist bewusst derselbe wie lokal (dieselbe Konfigurationsdatei,
# dieselben gepinnten Hook-Versionen) - zwei Fassungen derselben Regeln
# driften auseinander, und der Alarm daraus waere falsch.
#
# gitleaks prueft im CI den GESAMTEN Baum, nicht nur die Aenderung: Ein
# Geheimnis, das ueber einen Weg ohne Hooks hereingekommen ist, faellt sonst
# nie auf.
# Statt pre-commit/action: Der Wrapper bindet intern ein ungepinntes
# actions/cache@v4 ein, und beide Repos verlangen SHA-Pinning fuer JEDE Action
# (Scorecard "Pinned-Dependencies"). Der direkte Aufruf ist ohnehin
# durchsichtiger - zwei Zeilen statt einer Blackbox.
name: pre-commit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks braucht die Historie, um Diffs bewerten zu koennen;
          # --all-files unten prueft zusaetzlich den Arbeitsbaum.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: "8.5"
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit-Umgebungen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        # Version festgenagelt: Ein unversioniertes "pip install pre-commit"
        # zieht bei jedem Lauf, was gerade neu ist - dann entscheidet der
        # Zeitpunkt mit darueber, was geprueft wird, und ein Pflicht-Check
        # wird unreproduzierbar. Genau das meldet OpenSSF Scorecard als
        # Pinned-Dependencies; es war eine Regression gegen die
        # Pinning-Disziplin, die hier sonst ueberall gilt (Actions per SHA,
        # Images per Digest).
        #
        # Grenze, damit sie benannt ist: Der Abhaengigkeitsbaum von
        # pre-commit selbst ist nicht per Hash gepinnt - dafuer braeuchte es
        # eine erzeugte requirements-Datei mit --require-hashes, die bei jedem
        # Versionswechsel neu gebaut werden muss. Die Hook-Versionen, auf die
        # es hier ankommt, stehen ohnehin fest in .pre-commit-config.yaml.
        run: pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
