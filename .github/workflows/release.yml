# Release-Pipeline des Addons-Repos (#65)
#
# Läuft bei jedem Push eines "v*"-Tags. Die Versionierung folgt dem
# Framework (siehe docs/releasing.md): Ein Tag vX.Y.z ist der geprüfte
# Gesamtstand ALLER Addons, der zur Framework-Linie X.Y passt; die
# Patch-Stelle z läuft unabhängig (Addon-Fixes zwischen Framework-Releases).
#
#   1. Testsuite (tests.yml, wiederverwendet per workflow_call) als Gate -
#      kein Release, wenn irgendetwas fehlschlägt.
#   2. Konsistenzprüfung (scripts/check-release-consistency.php): Unter- UND
#      Pflicht-Obergrenze jedes plugins/*/plugin.json müssen die zum Tag
#      gehörende Framework-Linie einschließen - sonst behauptete der Release,
#      zu einem Kern zu passen, den ein enthaltenes Addon ausschließt.
#   3. GitHub-Release anlegen (bzw. Artefaktloser Eintrag zum Tag). Die
#      Beschreibung bleibt bewusst manuell/kuratiert (orientiert an
#      CHANGELOG.md) - wie im Framework-Repo.
#
# Verbraucherseite: Addon-Store und Addon-Autoupdate des Frameworks lesen
# für das offizielle Repo den besten Release-Tag der laufenden Kern-Linie
# statt des Branch-HEAD (Framework#197) - ein Release hier ist also der
# Stand, der auf Produktivinstanzen landet.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  konsistenz:
    name: Release-Konsistenz (Framework-Linie)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PHP einrichten
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: "8.5"

      - name: Manifeste gegen die Ziel-Linie des Tags pruefen
        run: php scripts/check-release-consistency.php "${GITHUB_REF}"

  release:
    name: GitHub-Release anlegen
    needs: [tests, konsistenz]
    # Nur beim Tag-Push, nicht bei manuellem workflow_dispatch-Testlauf.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release anlegen bzw. um Tag ergaenzen
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Titel/Beschreibung bewusst nicht gesetzt: bleiben manuell
          # kuratiert (CHANGELOG.md als Grundlage), wie im Framework.
          draft: false
          # Vorabversionen ausdrücklich als solche kennzeichnen - wie im
          # Framework. App\Service\AddonUpdateService bzw. der Store lesen
          # den prerelease-Schalter; ohne diese Zeile bekämen alle Instanzen
          # ein v0.8.0-beta.1 als reguläres Addon-Update angeboten.
          prerelease: ${{ contains(github.ref_name, '-') }}
