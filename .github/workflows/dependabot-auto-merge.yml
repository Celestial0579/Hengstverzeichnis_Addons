name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]

# Top-Level bewusst nur lesend: Der Workflow läuft als pull_request_target und
# hätte damit sonst in JEDEM Job Schreibrechte. Die Schreibrechte stehen deshalb
# ausschließlich am Job, der sie tatsächlich braucht (Prinzip der geringsten
# Rechte, OpenSSF-Scorecard "Token-Permissions").
permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 'gh pr merge --auto' aktiviert Auto-Merge am PR
      pull-requests: write   # dependabot/fetch-metadata + Merge des PRs
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
